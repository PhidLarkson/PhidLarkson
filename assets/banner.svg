<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Prince Larbi. XR, edge AI, IoT and digital twins.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a18"/><stop offset="1" stop-color="#0f1b3d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="type1"><rect x="48" y="150" height="40" width="0">
      <animate attributeName="width" values="0;560;560;0" keyTimes="0;.45;.9;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clipall"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clipall)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- orbit rings -->
    <g transform="translate(850 150)" fill="none" stroke="url(#glow)" stroke-width="1.4">
      <ellipse rx="170" ry="52" stroke-opacity=".35">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="140" ry="40" stroke-opacity=".5" transform="rotate(60)">
        <animateTransform attributeName="transform" type="rotate" from="60" to="-300" dur="20s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="110" ry="30" stroke-opacity=".7" transform="rotate(-60)">
        <animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="15s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="5" fill="#22d3ee" stroke="none">
        <animateMotion dur="6s" repeatCount="indefinite" path="M-170 0a170 52 0 1 0 340 0a170 52 0 1 0 -340 0"/>
      </circle>
      <circle r="4" fill="#a78bfa" stroke="none">
        <animateMotion dur="9s" repeatCount="indefinite" path="M110 0a110 30 0 1 0 -220 0a110 30 0 1 0 220 0"/>
      </circle>
    </g>

    <!-- headset -->
    <g transform="translate(850 150)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="5s" repeatCount="indefinite"/>
        <rect x="-62" y="-30" width="124" height="60" rx="22" fill="#0b1226" stroke="url(#glow)" stroke-width="2.2"/>
        <circle cx="-26" cy="0" r="15" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
        <circle cx="26" cy="0" r="15" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
        <circle cx="-26" cy="0" r="6" fill="#22d3ee" fill-opacity=".6">
          <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="26" cy="0" r="6" fill="#a78bfa" fill-opacity=".6">
          <animate attributeName="r" values="8;4;8" dur="3s" repeatCount="indefinite"/>
        </circle>
        <path d="M-62 -6C-86 -6 -86 12 -62 12M62 -6C86 -6 86 12 62 12" fill="none" stroke="url(#glow)" stroke-width="2"/>
        <!-- scan line -->
        <rect x="-60" y="-30" width="120" height="2" fill="#22d3ee" fill-opacity=".8">
          <animate attributeName="y" values="-30;28;-30" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- text -->
    <text x="48" y="86" font-family="'SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" fill="#7dd3fc" fill-opacity=".8">&gt; hello, world</text>
    <text x="48" y="146" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#f1f5f9">Prince Larbi</text>
    <g clip-path="url(#type1)">
      <text x="48" y="180" font-family="'SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" fill="url(#glow)">XR  |  edge AI  |  IoT  |  digital twins</text>
    </g>
    <rect x="48" y="224" width="3" height="22" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="62" y="242" font-family="'SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#94a3b8">Research Assistant at DIPPER Lab, KNUST. Building for low-resource settings.</text>
  </g>
</svg>
